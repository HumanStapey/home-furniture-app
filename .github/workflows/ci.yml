name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Lint, tests and builds
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      NEXT_TELEMETRY_DISABLED: '1'
      DB_HOST: 127.0.0.1
      DB_PORT: '5432'
      DB_NAME: home_furniture_test
      DB_USER: home_furniture
      DB_PASSWORD: ci_test_only
    services:
      postgres:
        image: postgres:18.6-alpine3.24
        env:
          POSTGRES_DB: home_furniture_test
          POSTGRES_USER: home_furniture
          POSTGRES_PASSWORD: ci_test_only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U home_furniture -d home_furniture_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          cache: npm

      - name: Set up npm
        run: npm install --global npm@11.6.2

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Check TypeScript
        run: npm run typecheck

      - name: Unit tests
        run: npm test

      - name: Apply database migrations
        run: npm run migration:run

      - name: Integration tests
        run: npm run test:integration --workspace @home-furniture/backend

      - name: Production builds
        run: npm run build

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Browser tests
        id: e2e
        run: npm run test:e2e --workspace @home-furniture/frontend -- --workers=2 --forbid-only --global-timeout=360000 --reporter=line,html

      - name: Upload browser failure reports
        if: ${{ failure() && steps.e2e.outcome == 'failure' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-failure-reports
          path: |
            frontend/playwright-report/
            frontend/test-results/
          retention-days: 7
